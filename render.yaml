services:
  - type: web
    name: digitalshield-api
    runtime: docker
    plan: free
    rootDir: backend/DigitalShield.API
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: digitalshield-db
          property: connectionString
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__Issuer
        value: DigitalShield
      - key: Jwt__Audience
        value: DigitalShieldUsers
      - key: Jwt__ExpiryMinutes
        value: "60"
      - key: Cors__AllowedOrigins
        sync: false
      - key: DatabaseSeeding__Enabled
        value: "true"
      - key: DatabaseMigrations__ApplyOnStartup
        value: "true"

databases:
  - name: digitalshield-db
    databaseName: digitalshield
    user: digitalshield
    plan: free
